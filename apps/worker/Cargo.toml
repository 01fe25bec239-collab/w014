[package]
name = "w014-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
w014-application = { path = "../../crates/w014-application" }
w014-document-processing = { path = "../../crates/w014-document-processing" }
w014-jobs = { path = "../../crates/w014-jobs" }
w014-persistence = { path = "../../crates/w014-persistence" }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
w014-authz = { path = "../../crates/w014-authz" }
w014-domain = { path = "../../crates/w014-domain" }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
serde_json = "1.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
