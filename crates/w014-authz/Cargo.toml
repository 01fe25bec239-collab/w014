[package]
name = "w014-authz"
version = "0.1.0"
edition = "2024"

[dependencies]
w014-domain = { path = "../w014-domain" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1.0"
