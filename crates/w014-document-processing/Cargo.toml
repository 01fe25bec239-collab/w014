[package]
name = "w014-document-processing"
version = "0.1.0"
edition = "2024"

[dependencies]
w014-domain = { path = "../w014-domain" }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "io-std", "time", "sync", "process", "macros", "rt", "rt-multi-thread"] }
tracing = "0.1"
async-trait = "0.1"
unicode-normalization = "0.1"
pdfium-render = { version = "0.9", features = ["bindings", "thread_safe"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
ooxmlsdk = "0.12.0"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net"] }
w014-persistence = { path = "../w014-persistence" }

[[bin]]
name = "w014-parser-sandbox"
path = "src/bin/w014-parser-sandbox.rs"

