[package]
name = "w014-jobs"
version = "0.1.0"
edition = "2024"

[dependencies]
w014-persistence = { path = "../w014-persistence" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "migrate", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
