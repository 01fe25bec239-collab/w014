[package]
name = "w014-application"
version = "0.1.0"
edition = "2024"

[dependencies]
w014-domain = { path = "../w014-domain" }
w014-authn = { path = "../w014-authn" }
w014-authz = { path = "../w014-authz" }
w014-persistence = { path = "../w014-persistence" }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
hex = "0.4"
